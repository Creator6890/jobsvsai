name: jobsvsai

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jobsvsai}
      POSTGRES_USER: ${POSTGRES_USER:-jobsvsai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jobsvsai} -d ${POSTGRES_DB:-jobsvsai}"]
      interval: 5s
      timeout: 5s
      retries: 15
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://jobsvsai:change-me@postgres:5432/jobsvsai}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-too}
      # Passed through as empty when unset, NOT as an explicit false. An explicit false
      # here would outrank the deprecated NEWS_ENABLED and silently disable an environment
      # that is currently running on it. Unset stays unset; the code default is disabled.
      NEWS_INGESTION_ENABLED: ${NEWS_INGESTION_ENABLED:-}
      NEWS_GENERATION_ENABLED: ${NEWS_GENERATION_ENABLED:-}
      # Deprecated. Passed through only so an environment that still sets it keeps
      # working; the split flags above take precedence when explicitly set.
      NEWS_ENABLED: ${NEWS_ENABLED:-}
      NEWS_LLM_PROVIDER: ${NEWS_LLM_PROVIDER:-null}
      NEWS_LLM_API_KEY: ${NEWS_LLM_API_KEY:-}
      NEWS_LLM_MODEL: ${NEWS_LLM_MODEL:-}
      NEWS_LLM_TIMEOUT_SECONDS: ${NEWS_LLM_TIMEOUT_SECONDS:-90}
      NEWS_AUTO_PUBLISH: ${NEWS_AUTO_PUBLISH:-false}
      NEWS_DAILY_GENERATION_LIMIT: ${NEWS_DAILY_GENERATION_LIMIT:-5}
      NEWS_GENERATION_BATCH_SIZE: ${NEWS_GENERATION_BATCH_SIZE:-2}
      # Aliases for the two caps above; empty unless the operator sets them.
      NEWS_MAX_GENERATIONS_PER_RUN: ${NEWS_MAX_GENERATIONS_PER_RUN:-}
      NEWS_MAX_GENERATIONS_PER_DAY: ${NEWS_MAX_GENERATIONS_PER_DAY:-}
      NEWS_LLM_COST_PER_1M_INPUT: ${NEWS_LLM_COST_PER_1M_INPUT:-}
      NEWS_LLM_COST_PER_1M_OUTPUT: ${NEWS_LLM_COST_PER_1M_OUTPUT:-}
      NEWS_FETCH_INTERVAL_MINUTES: ${NEWS_FETCH_INTERVAL_MINUTES:-120}
      NEWS_LOOKBACK_HOURS: ${NEWS_LOOKBACK_HOURS:-48}
      NEWS_MAX_ENTRIES_PER_FEED: ${NEWS_MAX_ENTRIES_PER_FEED:-40}
      NEWS_MAX_CANDIDATES_PER_RUN: ${NEWS_MAX_CANDIDATES_PER_RUN:-60}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./scoring:/app/scoring
      - ./ingestion:/app/ingestion:ro
      - ./enrichment:/app/enrichment:ro
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://jobsvsai:change-me@postgres:5432/jobsvsai}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      QUEUE_NAME: ${QUEUE_NAME:-default}
      # Passed through as empty when unset, NOT as an explicit false. An explicit false
      # here would outrank the deprecated NEWS_ENABLED and silently disable an environment
      # that is currently running on it. Unset stays unset; the code default is disabled.
      NEWS_INGESTION_ENABLED: ${NEWS_INGESTION_ENABLED:-}
      NEWS_GENERATION_ENABLED: ${NEWS_GENERATION_ENABLED:-}
      # Deprecated. Passed through only so an environment that still sets it keeps
      # working; the split flags above take precedence when explicitly set.
      NEWS_ENABLED: ${NEWS_ENABLED:-}
      NEWS_LLM_PROVIDER: ${NEWS_LLM_PROVIDER:-null}
      NEWS_LLM_API_KEY: ${NEWS_LLM_API_KEY:-}
      NEWS_LLM_MODEL: ${NEWS_LLM_MODEL:-}
      NEWS_LLM_TIMEOUT_SECONDS: ${NEWS_LLM_TIMEOUT_SECONDS:-90}
      NEWS_AUTO_PUBLISH: ${NEWS_AUTO_PUBLISH:-false}
      NEWS_DAILY_GENERATION_LIMIT: ${NEWS_DAILY_GENERATION_LIMIT:-5}
      NEWS_GENERATION_BATCH_SIZE: ${NEWS_GENERATION_BATCH_SIZE:-2}
      # Aliases for the two caps above; empty unless the operator sets them.
      NEWS_MAX_GENERATIONS_PER_RUN: ${NEWS_MAX_GENERATIONS_PER_RUN:-}
      NEWS_MAX_GENERATIONS_PER_DAY: ${NEWS_MAX_GENERATIONS_PER_DAY:-}
      NEWS_LLM_COST_PER_1M_INPUT: ${NEWS_LLM_COST_PER_1M_INPUT:-}
      NEWS_LLM_COST_PER_1M_OUTPUT: ${NEWS_LLM_COST_PER_1M_OUTPUT:-}
      NEWS_FETCH_INTERVAL_MINUTES: ${NEWS_FETCH_INTERVAL_MINUTES:-120}
      NEWS_LOOKBACK_HOURS: ${NEWS_LOOKBACK_HOURS:-48}
      NEWS_MAX_ENTRIES_PER_FEED: ${NEWS_MAX_ENTRIES_PER_FEED:-40}
      NEWS_MAX_CANDIDATES_PER_RUN: ${NEWS_MAX_CANDIDATES_PER_RUN:-60}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes:
      - ./backend/app:/app/app
      - ./scoring:/app/scoring
      - ./worker:/app/worker

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID:-}
        NEXT_PUBLIC_ADS_ENABLED: ${NEXT_PUBLIC_ADS_ENABLED:-false}
        NEXT_PUBLIC_ADSENSE_CLIENT_ID: ${NEXT_PUBLIC_ADSENSE_CLIENT_ID:-}
        NEXT_PUBLIC_ADS_DEBUG: ${NEXT_PUBLIC_ADS_DEBUG:-false}
        NEXT_PUBLIC_ADSENSE_SLOT_HOME: ${NEXT_PUBLIC_ADSENSE_SLOT_HOME:-}
        NEXT_PUBLIC_ADSENSE_SLOT_JOB_PRIMARY: ${NEXT_PUBLIC_ADSENSE_SLOT_JOB_PRIMARY:-}
        NEXT_PUBLIC_ADSENSE_SLOT_JOB_SECONDARY: ${NEXT_PUBLIC_ADSENSE_SLOT_JOB_SECONDARY:-}
        NEXT_PUBLIC_ADSENSE_SLOT_RANKINGS: ${NEXT_PUBLIC_ADSENSE_SLOT_RANKINGS:-}
        NEXT_PUBLIC_ADSENSE_SLOT_COMPARE: ${NEXT_PUBLIC_ADSENSE_SLOT_COMPARE:-}
        NEXT_PUBLIC_ADSENSE_SLOT_NEWS_LIST: ${NEXT_PUBLIC_ADSENSE_SLOT_NEWS_LIST:-}
        NEXT_PUBLIC_ADSENSE_SLOT_NEWS_ARTICLE: ${NEXT_PUBLIC_ADSENSE_SLOT_NEWS_ARTICLE:-}
    environment:
      API_INTERNAL_URL: http://backend:8000
      ENVIRONMENT: ${ENVIRONMENT:-development}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID:-}
      NEXT_PUBLIC_ADS_ENABLED: ${NEXT_PUBLIC_ADS_ENABLED:-false}
      NEXT_PUBLIC_ADSENSE_CLIENT_ID: ${NEXT_PUBLIC_ADSENSE_CLIENT_ID:-}
      NEXT_PUBLIC_ADS_DEBUG: ${NEXT_PUBLIC_ADS_DEBUG:-false}
      NEXT_PUBLIC_ADSENSE_SLOT_HOME: ${NEXT_PUBLIC_ADSENSE_SLOT_HOME:-}
      NEXT_PUBLIC_ADSENSE_SLOT_JOB_PRIMARY: ${NEXT_PUBLIC_ADSENSE_SLOT_JOB_PRIMARY:-}
      NEXT_PUBLIC_ADSENSE_SLOT_JOB_SECONDARY: ${NEXT_PUBLIC_ADSENSE_SLOT_JOB_SECONDARY:-}
      NEXT_PUBLIC_ADSENSE_SLOT_RANKINGS: ${NEXT_PUBLIC_ADSENSE_SLOT_RANKINGS:-}
      NEXT_PUBLIC_ADSENSE_SLOT_COMPARE: ${NEXT_PUBLIC_ADSENSE_SLOT_COMPARE:-}
      NEXT_PUBLIC_ADSENSE_SLOT_NEWS_LIST: ${NEXT_PUBLIC_ADSENSE_SLOT_NEWS_LIST:-}
      NEXT_PUBLIC_ADSENSE_SLOT_NEWS_ARTICLE: ${NEXT_PUBLIC_ADSENSE_SLOT_NEWS_ARTICLE:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-too}
    depends_on:
      backend: { condition: service_healthy }
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  redis_data:
